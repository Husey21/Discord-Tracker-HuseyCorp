<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DC Tracker | OSINT Intelligence</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;800&display=swap');

        :root {
            --bg: #050505;
            --panel: #0a0a0c;
            --border: #1f1f23;
            --text: #e0e0e0;
            --text-muted: #888;
            --accent: #ff003c;
            --accent-glow: rgba(255, 0, 60, 0.3);
            --success: #00ff66;
            --warning: #ffcc00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: 
                linear-gradient(rgba(255, 0, 60, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 60, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            overflow-x: hidden;
        }

        .header {
            width: 100%;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-family: 'Fira Code', monospace;
            font-size: 24px;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .header h1 span {
            color: var(--text);
            font-size: 14px;
            background: var(--border);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 2px;
            height: 100%;
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
        }

        .panel-title {
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-title::before {
            content: '>';
            color: var(--accent);
        }

        /* Search Input */
        .search-box {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 15px 20px;
            font-family: 'Fira Code', monospace;
            font-size: 16px;
            border-radius: 6px;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0 30px;
            font-family: 'Fira Code', monospace;
            font-weight: 600;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: #d40032;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        button:disabled {
            background: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Results */
        #results {
            display: none;
            flex-direction: column;
            gap: 20px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            background: var(--bg);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .profile-info h2 {
            font-family: 'Fira Code', monospace;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .profile-info p {
            color: var(--text-muted);
            font-family: 'Fira Code', monospace;
            font-size: 14px;
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }

        .data-item {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 6px;
        }

        .data-label {
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .data-value {
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            word-break: break-all;
        }

        .data-value.success { color: var(--success); }
        .data-value.warning { color: var(--warning); }
        .data-value.danger { color: var(--accent); }

        /* Webhook Section */
        #webhook-section {
            display: none;
            margin-top: 20px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .webhook-input {
            width: 100%;
            margin-bottom: 10px;
        }

        /* Loading */
        .loader {
            display: none;
            text-align: center;
            padding: 20px;
            font-family: 'Fira Code', monospace;
            color: var(--accent);
            font-size: 14px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Fira Code', monospace;
            margin-left: 10px;
        }
        .status-badge.safe { background: rgba(0, 255, 102, 0.1); color: var(--success); border: 1px solid var(--success); }
        .status-badge.flagged { background: rgba(255, 204, 0, 0.1); color: var(--warning); border: 1px solid var(--warning); }
        .status-badge.banned { background: rgba(255, 0, 60, 0.1); color: var(--accent); border: 1px solid var(--accent); }
    </style>
</head>
<body>

    <div class="header">
        <h1>DC TRACKER <span>v2.1</span></h1>
    </div>

    <div class="container">
        <div class="panel">
            <div class="panel-title">Target Acquisition</div>
            <div class="search-box">
                <input type="text" id="discordId" placeholder="Enter Discord ID (ex: 123456789012345678)" autocomplete="off">
                <button id="trackBtn" onclick="trackTarget()">Track</button>
            </div>
            <div id="errorMsg" style="color: var(--accent); font-family: 'Fira Code', monospace; font-size: 14px; margin-top: 10px; display: none;"></div>
        </div>

        <div class="loader" id="loader">[ SYSTEM ] INITIALIZING OSINT PROTOCOLS...</div>

        <div id="results">
            <div class="panel">
                <div class="panel-title">Target Intel</div>
                
                <div class="profile-header">
                    <img src="" id="resAvatar" class="avatar" alt="Avatar">
                    <div class="profile-info">
                        <h2 id="resUsername">Unknown</h2>
                        <p id="resTag">@unknown</p>
                        <div id="resStatusContainer"></div>
                    </div>
                </div>

                <div class="data-grid">
                    <div class="data-item">
                        <div class="data-label">Discord ID</div>
                        <div class="data-value" id="resId">-</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">Account Created</div>
                        <div class="data-value" id="resCreated">-</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">Account Age</div>
                        <div class="data-value" id="resAge">-</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">Public Flags</div>
                        <div class="data-value" id="resFlags">-</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">Infractions (Simulées)</div>
                        <div class="data-value warning" id="resInfractions">-</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">IP Trace (Simulée)</div>
                        <div class="data-value danger" id="resIp">-</div>
                    </div>
                </div>
            </div>

            <div class="panel" id="webhook-section">
                <div class="panel-title">Data Exfiltration (Webhook)</div>
                <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 15px;">Send all tracked data to a Discord Webhook.</p>
                <input type="text" id="webhookUrl" class="webhook-input" placeholder="https://discord.com/api/webhooks/...">
                <button onclick="sendWebhook()" id="webhookBtn">Transmit Data</button>
                <div id="webhookStatus" style="font-family: 'Fira Code', monospace; font-size: 12px; margin-top: 10px;"></div>
            </div>
        </div>
    </div>

    <script>
        let currentTargetData = null;

        // Fonction principale de tracking
        async function trackTarget() {
            const idInput = document.getElementById('discordId').value.trim();
            const btn = document.getElementById('trackBtn');
            const loader = document.getElementById('loader');
            const results = document.getElementById('results');
            const errorMsg = document.getElementById('errorMsg');

            // Validation basique de l'ID
            if (!/^\d{17,20}$/.test(idInput)) {
                errorMsg.textContent = "Invalid Discord ID format. Must be 17-20 digits.";
                errorMsg.style.display = 'block';
                return;
            }

            errorMsg.style.display = 'none';
            results.style.display = 'none';
            loader.style.display = 'block';
            btn.disabled = true;

            try {
                // On utilise l'API publique de DiscordLookup pour récupérer les infos de base
                const response = await fetch(`https://discordlookup.mesavirep.xyz/v1/user/${idInput}`);
                
                if (!response.ok) throw new Error("User not found or API error");
                
                const data = await response.json();

                // Calcul de l'âge du compte via le Snowflake (Timestamp de création)
                const timestamp = (BigInt(idInput) >> 22n) + 1420070400000n;
                const createdDate = new Date(Number(timestamp));
                const now = new Date();
                const ageDays = Math.floor((now - createdDate) / (1000 * 60 * 60 * 24));

                // Simulation des infractions basées sur l'ID (pour l'effet OSINT)
                // Plus l'ID est petit, plus le compte est vieux, moins il a d'infractions (fausse logique mais réaliste visuellement)
                let infractions = "None";
                let statusClass = "safe";
                let statusText = "CLEAN";

                if (ageDays < 30) {
                    infractions = "Suspicious Activity (New Account)";
                    statusClass = "flagged";
                    statusText = "FLAGGED";
                } else if (idInput.startsWith('1') && idInput.length < 18) {
                    infractions = "Multiple Policy Violations (Legacy Account)";
                    statusClass = "banned";
                    statusText = "COMPROMISED";
                }

                // Mise à jour de l'UI
                document.getElementById('resAvatar').src = data.avatar?.link || 'https://discord.com/assets/1f0bfc0865d32402347812c5b3c2d135.svg';
                document.getElementById('resUsername').textContent = data.global_name || data.username || "Unknown User";
                document.getElementById('resTag').textContent = `@${data.username || "unknown"}`;
                document.getElementById('resId').textContent = idInput;
                document.getElementById('resCreated').textContent = createdDate.toLocaleString();
                document.getElementById('resAge').textContent = `${ageDays} Days`;
                document.getElementById('resFlags').textContent = data.public_flags?.length > 0 ? data.public_flags.join(', ') : "None";
                document.getElementById('resInfractions').textContent = infractions;
                
                // Fausse IP pour le style
                document.getElementById('resIp').textContent = `${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.XXX.XXX (Proxied)`;

                const statusContainer = document.getElementById('resStatusContainer');
                statusContainer.innerHTML = `<span class="status-badge ${statusClass}">${statusText}</span>`;

                // Sauvegarde des données pour le Webhook
                currentTargetData = {
                    id: idInput,
                    username: data.username,
                    global_name: data.global_name,
                    created_at: createdDate.toLocaleString(),
                    age_days: ageDays,
                    infractions: infractions,
                    status: statusText,
                    avatar: data.avatar?.link || ''
                };

                // Affichage
                results.style.display = 'flex';
                document.getElementById('webhook-section').style.display = 'block';
                document.getElementById('webhookStatus').textContent = '';

            } catch (error) {
                errorMsg.textContent = "ERROR: Target ID not found in Discord databases.";
                errorMsg.style.display = 'block';
            } finally {
                loader.style.display = 'none';
                btn.disabled = false;
            }
        }

        // Fonction d'envoi au Webhook
        async function sendWebhook() {
            const url = document.getElementById('webhookUrl').value.trim();
            const statusDiv = document.getElementById('webhookStatus');
            const btn = document.getElementById('webhookBtn');

            if (!url.startsWith('https://discord.com/api/webhooks/')) {
                statusDiv.textContent = "Invalid Webhook URL.";
                statusDiv.style.color = "var(--accent)";
                return;
            }

            if (!currentTargetData) return;

            btn.disabled = true;
            statusDiv.textContent = "Transmitting data...";
            statusDiv.style.color = "var(--warning)";

            // Construction de l'embed Discord
            const embed = {
                title: "🎯 TARGET ACQUIRED",
                description: `**Discord ID:** \`${currentTargetData.id}\`\n**Status:** ${currentTargetData.status}`,
                color: 16711740, // Rouge néon
                fields: [
                    { name: "Username", value: currentTargetData.username || "N/A", inline: true },
                    { name: "Display Name", value: currentTargetData.global_name || "N/A", inline: true },
                    { name: "Account Created", value: currentTargetData.created_at, inline: false },
                    { name: "Account Age", value: `${currentTargetData.age_days} Days`, inline: true },
                    { name: "Infractions", value: currentTargetData.infractions, inline: true }
                ],
                thumbnail: { url: currentTargetData.avatar || "" },
                footer: { text: "DC Tracker v2.1 | OSINT Engine" },
                timestamp: new Date().toISOString()
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: "DC Tracker",
                        avatar_url: "https://cdn.discordapp.com/attachments/1090357916761014384/1122204522968244274/logo.png", // Une image random de logo
                        embeds: [embed]
                    })
                });

                if (response.ok) {
                    statusDiv.textContent = "SUCCESS: Data exfiltrated.";
                    statusDiv.style.color = "var(--success)";
                } else {
                    throw new Error("Webhook failed");
                }
            } catch (error) {
                statusDiv.textContent = "ERROR: Webhook transmission failed.";
                statusDiv.style.color = "var(--accent)";
            } finally {
                btn.disabled = false;
            }
        }

        // Permettre de lancer la recherche avec Entrée
        document.getElementById('discordId').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                trackTarget();
            }
        });
    </script>
</body>
</html>
